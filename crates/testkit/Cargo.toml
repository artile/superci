[package]
name = "superci-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Test-only: a SuperCI control plane served on this computer, with stand-ins for the clouds, for tests of the CLI and the dashboard against it."

[dependencies]
superci-core = { path = "../core" }
async-trait.workspace = true
base64.workspace = true
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde_json.workspace = true
url = "2"
# Modal's API over gRPC (HTTP/2), as the CLI calls it in tests.
h2 = "0.4.19"
http = "1.5.0"
bytes = "1.12.1"
tokio = { version = "1.53.1", features = ["rt", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
