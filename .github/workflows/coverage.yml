name: Coverage

# The tests, measured by supercov: lines, branches and MC/DC, each test's own. Run by hand (Actions → Coverage):
# every test, or the browser suite alone (what the dashboard and control plane are covered by end to end, in Chrome).
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Every test, or the browser suite alone
        type: choice
        options: [all, browser]
        default: all

permissions:
  contents: read

jobs:
  coverage:
    # Ubuntu 26.04, as SuperCI's machines that keep Docker's images: its kernel mounts EROFS files, so the layer
    # store's setup is measured switching Docker over (GitHub's 24.04 kernel cannot).
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # (No cache of Zig's own: one of 250 MB a run filled the repository's cache, and the Rust cache was evicted.)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      # (cargo-zigbuild built, downloaded; worker-build has no build to download: compiled once, then kept by the Rust
      # cache.)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: worker-build
        run: cargo install --locked worker-build
      - name: Build
        run: ./build.sh
      - name: The kernel's EROFS (the layer store's setup test mounts its files from a container, which loads no module)
        run: |
          uname -r
          grep -E 'CONFIG_EROFS_FS(=|_BACKED_BY_FILE|_ONDEMAND)' "/boot/config-$(uname -r)" || true
          sudo modprobe erofs && grep erofs /proc/filesystems
      - name: The tests, measured
        if: inputs.tests != 'browser'
        # (In supercov's own copy of the repository: what ./build.sh built is found in this one.)
        env:
          SUPERCI_BUILT: ${{ github.workspace }}
          # (superci-layers' end-to-end suite in a privileged container, measured with the rest.)
          SUPERCI_LAYERS_E2E: "1"
          IMAGES: mirror.gcr.io/library
        run: npx -y supercov@4.19.0 -- cargo test --workspace
      - name: The browser suite, measured
        if: inputs.tests == 'browser'
        env:
          SUPERCI_BUILT: ${{ github.workspace }}
          # (A page waits longer under a coverage run, a few at a time.)
          SUPERCI_BROWSER_WAIT_S: "120"
        run: |
          # (Its tests skip themselves where there is no Chrome: a measure of skipped tests would say nothing.)
          google-chrome --version || { echo "No Chrome on this runner: the browser suite would skip itself." >&2; exit 1; }
          npx -y supercov@4.19.0 -- cargo test -p superci --no-fail-fast --test browser -- --test-threads=4
      - name: What the tests reach
        if: always()
        run: |
          npx -y supercov@4.19.0 runs latest
          npx -y supercov@4.19.0 runs latest gaps
          npx -y supercov@4.19.0 runs latest file crates/cli/src/dashboard.rs --group decision --sort missing --limit 80
          # Each file's conditions still to show, by decision, kept with the run (to read without measuring again).
          mkdir -p gaps
          # (Every source file's, named by its path: crates/core/src/aws.rs is core-aws.txt.)
          for f in crates/cli/src/*.rs crates/core/src/*.rs; do
            n=$(echo "$f" | sed -e 's|^crates/||' -e 's|/src/|-|' -e 's|\.rs$||')
            npx -y supercov@4.19.0 runs latest file "$f" --group decision --sort missing --limit 3000 > "gaps/$n.txt" || true
          done
          npx -y supercov@4.19.0 runs latest files --limit 0 > gaps/files.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: .supercov/runs
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaps
          path: gaps
